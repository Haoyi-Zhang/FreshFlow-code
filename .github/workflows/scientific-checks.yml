name: Finite scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      README_ENTRY: README.md
      MIN_EXPECTED_PYTHON_SOURCES: '24'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay tests, finite campaigns, and generated paper data
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 300s bash -euo pipefail -c '
            ulimit -t 240
            ulimit -v 3145728
            python -B .github/scripts/check_repository.py > repository-check.json
            python -B reproduce.py --out scientific-output
            python -B make_paper_data.py --out paper-data-check
            cmp paper-data/validation-macros.tex paper-data-check/validation-macros.tex
            cmp paper-data/validation-table.tex paper-data-check/validation-table.tex
          '
      - name: Preserve raw outputs even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-scientific-outputs
          path: |
            repository-check.json
            scientific-output/
            paper-data-check/
          if-no-files-found: error
          retention-days: 14
